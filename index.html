<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather_app</title>
  </head>
  <body
    class="flex flex-col items-center justify-center text-gray-800 min-h-screen bg-linear-to-t"
  >
    <section
      id="weatherSection"
      class="flex flex-col items-center justify-center gap-4"
    >
      <h1 id="main-heading" class="text-3xl font-bold">Weather App</h1>

      <form id="searchForm" class="flex flex-col w-sm">
        <label for="cityInput" class="text-white mb-2">Enter a city:</label>
        <input
          type="text"
          id="cityInput"
          placeholder="eg. Stockholm or New York"
          class="p-2 rounded border bg-white mb-4"
        />

        <button
          type="submit"
          id="searchBtn"
          class="bg-blue-950 text-white px-4 py-2 rounded hover:bg-blue-800 hover:cursor-pointer"
        >
          Search city
        </button>
      </form>
    </section>

    <section
      id="displayWeather"
      class="mt-6 text-center text-gray-50"
    ></section>

    <script type="module" src="/src/main.ts"></script>
    <script
      src="https://kit.fontawesome.com/b2d9bcb346.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
